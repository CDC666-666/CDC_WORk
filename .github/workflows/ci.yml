name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: cdc_workspace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cdc_workspace"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/cdc_workspace?schema=public
      NEXTAUTH_URL: http://localhost:3100
      ALLOWED_GITHUB_USER_ID: "248133835"
      TEST_BASE_URL: http://localhost:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create temporary auth secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Apply test database migration
        run: npm run db:deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Database test
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Install browser for migration page regression
        run: npx playwright install --with-deps chromium --only-shell
      - name: Private API test
        run: |
          npm run start -- -p 3100 > next-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100/login > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
          npm run test:browser

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create temporary local environment
        run: |
          password="$(openssl rand -hex 20)"
          secret="$(openssl rand -hex 32)"
          {
            printf 'POSTGRES_USER=cdc\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$password"
            printf 'POSTGRES_DB=cdc_workspace\n'
            printf 'DATABASE_URL=postgresql://cdc:%s@localhost:5432/cdc_workspace?schema=public\n' "$password"
            printf 'NEXTAUTH_URL=http://localhost:3000\n'
            printf 'NEXTAUTH_SECRET=%s\n' "$secret"
            printf 'GITHUB_CLIENT_ID=\nGITHUB_CLIENT_SECRET=\n'
            printf 'ALLOWED_GITHUB_USER_ID=248133835\n'
          } > .env
      - name: Build and start Compose services
        run: docker compose up --build --wait -d
      - name: Verify health, migration, and private access
        run: |
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")" = healthy
          docker compose exec -T web npx prisma migrate status
          curl --silent --show-error --fail http://localhost:3000/login > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/private/reviews)" = 401
      - name: Exercise private API inside Compose
        run: docker compose exec -T -e TEST_BASE_URL=http://localhost:3000 web npm run test:api
      - name: Exercise PostgreSQL migration inside Compose
        run: docker compose exec -T web npm run test:db
      - name: Restart containers and verify persisted review
        run: |
          marker="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker compose exec -T web node --import tsx tests/server/compose-persistence.ts prepare "$marker"
          docker compose restart db web
          docker compose up --wait -d
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")" = healthy
          docker compose exec -T web node --import tsx tests/server/compose-persistence.ts verify "$marker"
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop Compose services
        if: always()
        run: docker compose down
